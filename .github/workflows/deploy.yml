name: Build and Deploy
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3
      - name: Setup Node.js 🥗
        uses: actions/setup-node@v3
        with:
          node-version: "25"
      # Same image and engine as the private repo that generates resume.tex. Two passes
      # so hyperref's PDF bookmarks get embedded.
      - name: Prepare Resume 📝
        run: |
          docker run --rm -v "$PWD/resume":/w -w /w --user "$(id -u):$(id -g)" \
            texlive/texlive:latest sh -c '"$@" && "$@"' sh \
            pdflatex -interaction=nonstopmode -halt-on-error resume.tex
      - name: Copy Resume 📄
        run: |
          mkdir -p ./public/assets/docs
          cp ./resume/*.pdf ./public/assets/docs/
      - name: Install 🚚
        run: npm install
      - name: Build 📦
        run: |
          npm run build
          touch out/.nojekyll
      - name: Deploy 🚀
        if: github.actor != 'dependabot[bot]'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: out
